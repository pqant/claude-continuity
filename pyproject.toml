[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-continuity"
version = "0.3.70"
description = "Zero-touch session rotation for Claude Code (local large-context model)"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []  # stdlib only at runtime (PRD §0.5)

[project.scripts]
cc-continuity = "cc_continuity.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["cc_continuity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
